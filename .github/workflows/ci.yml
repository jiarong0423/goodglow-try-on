# Every push to main and every pull request: the test suite, the reproducible measurement, the translation-table
# checks, and a check that every number the documentation states is what the code and data produce (tools/check_claims.py).
name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  tests-and-claims:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Tests (no network, no credits)
        run: python -B -m unittest discover -s tests
      - name: Reproducible lighter-patch measurement
        run: python -I -B tools/repro_region_gap.py
      - name: Translation tables are consistent
        run: |
          python -B tools/build_i18n.py --check
          python -B tools/i18n_annotate_html.py --check
          python -B tools/i18n_apply_js.py --check
      - name: Documentation numbers match the code and data
        run: python -B tools/check_claims.py
