<title id="operating-modes-title">Operating modes</title>
<desc id="operating-modes-desc">At start the server reads four settings; with any missing it is demo only, with all four set anonymous visitors stay in demo mode and a signed-in judge reaches live mode until a limit is reached.</desc>
